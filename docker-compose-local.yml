version: '2.1'

services:
  postgres:
    image: postgres:9.3
    environment:
      - POSTGRES_USER=aqrsystem
      - POSTGRES_PASSWORD=aqrsystemsecret
      - POSTGRES_DB=aqrsystem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqrsystem -d aqrsystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  tomcat:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
